# Local integration smoke panel. This panel overlaps the historical K29 data.
run:
  output_dir: ../../runs
benchmark:
  name: deepswe
  data_path: ../../../baseline/ahe/datasets/deepswe-dev5
  seed: 42
  split_counts: {train: 1, dev: 1, test: 1}
agent:
  name: metacorsi
  project_dir: ../../../MetaCogRSI-main
  python: ../../../baseline/metacorsi/.venv/bin/python
  timeout: 5400
  max_turns: 24
  max_extension: 6
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com/v1
    # Export METACORSI_DSH_API_KEY before running.
algorithm:
  name: metacorsi
  max_steps: 1
  worker:
    type: none
