# Development smoke with DeepSeek Harness. Set benchmark.data_path for local tasks.
run:
  output_dir: ../../runs
benchmark:
  name: deepswe
  seed: 42
  split_counts: {train: 1, dev: 1, test: 1}
agent:
  name: metacorsi
  project_dir: ../../../metacorsi
  # Set agent.python or METACORSI_PYTHON to a Python with Harbor 0.24.0.
  timeout: 5400
  max_turns: 24
  max_extension: 6
  llm:
    model_name: deepseek-flash
    base_url: https://api.deepseek.com/v1
    # Export METACORSI_DSH_API_KEY before running.
algorithm:
  name: metacorsi
  max_steps: 1
  worker:
    type: none
